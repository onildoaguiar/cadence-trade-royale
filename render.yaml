services:
  - type: web
    name: cadence-trade-royale
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OMP_NUM_THREADS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13.0"
