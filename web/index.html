<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trending Royale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <p class="kicker">A demo of <a href="https://github.com/muellerberndt/cadence" target="_blank" rel="noreferrer">Cadence</a></p>
      <h1>Trending Royale</h1>
      <p class="lede">Five crypto stories each. Faster lists score more.</p>
    </div>
    <div class="regime" id="regime" data-regime="timeline">
      <span class="regime-kicker">fastest</span>
      <strong id="regime-name">reading trends</strong>
      <span id="regime-pays">this trend pays</span>
    </div>
    <div class="clock">
      <span id="phase-label">raising</span>
      <b id="moment">0</b>
      <span class="clock-note">steps</span>
    </div>
  </header>

  <main>
    <section class="board-wrap" id="board-wrap">
      <div class="feed-head">
        <h2>Ranking</h2>
        <p id="event"></p>
      </div>
      <ol class="ranking" id="ranking"></ol>
    </section>

    <section class="side">
      <div class="feed-head">
        <h2>Pool</h2>
        <p>Crypto news. Read only.</p>
      </div>
      <ol class="trends" id="trends"></ol>
      <div class="chart-block">
        <div class="chart-key">
          <span id="chart-who">Click a brain</span>
          <span><i class="swatch live" id="chart-live"></i> its list</span>
          <span><i class="swatch frozen"></i> stopped</span>
        </div>
        <canvas id="chart" width="640" height="120"></canvas>
      </div>
    </section>
  </main>

  <footer>
    <div class="controls">
      <button type="button" id="play" disabled>Play</button>
      <button type="button" id="round" disabled>Clear scores</button>
    </div>
    <div class="scores" id="scores">
      <p><span>learning</span><b id="score-live">0</b></p>
      <p><span>stopped</span><b id="score-frozen">0</b></p>
      <p><span>random</span><b id="score-random">0</b></p>
    </div>
    <section class="inspector" id="inspector">
      <p class="inspector-empty">Click a brain.</p>
    </section>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
